spring:
  datasource:
    url: jdbc:h2:mem:motorsports;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    show-sql: false
    properties:
      hibernate.format_sql: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
springdoc:
  swagger-ui:
    path: /
    url: /specs.yml
server:
  error:
    include-binding-errors: always